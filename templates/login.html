<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · ZEN AI</title>
    <link rel="icon" type="image/svg+xml" href="/static/app/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        // Match the theme chosen in the app (Settings → Appearance).
        try {
            var t = localStorage.getItem("theme");
            if (t === "dark" || ((!t || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches)) {
                document.documentElement.classList.add("dark");
            }
        } catch (e) {}
    </script>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #0a0a0a;
            --muted: #737373;
            --border: #e5e5e5;
            --card: #ffffff;
            --btn-hover: #f5f5f5;
            --glow: rgba(124, 58, 237, 0.12);
        }
        .dark {
            --bg: #0a0a0a;
            --fg: #fafafa;
            --muted: #a3a3a3;
            --border: rgba(255, 255, 255, 0.1);
            --card: #171717;
            --btn-hover: #262626;
            --glow: rgba(124, 58, 237, 0.22);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background:
                radial-gradient(60rem 30rem at 50% -10%, var(--glow), transparent 70%),
                var(--bg);
            color: var(--fg);
            font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #8b5cf6, #4f46e5);
            color: #fff;
            box-shadow: 0 10px 30px -10px rgba(79, 70, 229, 0.6);
            margin-bottom: 24px;
        }

        h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 8px; }
        .tagline { font-size: 15px; color: var(--muted); margin-bottom: 32px; }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 12px 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            color: var(--fg);
            font: inherit;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.15s, border-color 0.15s;
        }
        .google-btn:hover { background: var(--btn-hover); }
        .google-btn:focus-visible { outline: 2px solid #7c3aed; outline-offset: 2px; }

        .error-banner {
            display: none;
            width: 100%;
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            color: #dc2626;
            background: rgba(220, 38, 38, 0.08);
            border: 1px solid rgba(220, 38, 38, 0.25);
        }

        .terms { margin-top: 28px; font-size: 12px; color: var(--muted); line-height: 1.6; }
        .terms a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
        .terms a:hover { color: var(--fg); }

        .footer { margin-top: 40px; font-size: 12px; color: var(--muted); }
    </style>
</head>
<body>

<main class="card">
    <div class="logo" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
            <path d="M18.4 8.2A7.5 7.5 0 1 0 19.5 12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
    </div>

    <h1>Welcome to ZEN AI</h1>
    <p class="tagline">Your intelligent assistant with memory.</p>

    <a href="/google-login" class="google-btn">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
    </a>

    <!-- Shows if Google returns ?error= in URL -->
    <div class="error-banner" id="errorBanner" role="alert">
        Sign-in didn't work. Please try again.
    </div>

    <p class="terms">
        By continuing, you agree to ZEN AI's
        <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </p>

    <p class="footer">Built by ZEN Labs</p>
</main>

<script>
    if (new URLSearchParams(window.location.search).get('error')) {
        document.getElementById('errorBanner').style.display = 'block';
    }
</script>

</body>
</html>
